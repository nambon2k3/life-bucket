{{- if not .Values.env.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "backend.fullname" . }}
  labels:
    {{- include "backend.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "backend.databaseUrl" . | quote }}
  REDIS_URL: {{ include "backend.redisUrl" (dict "root" . "db" .Values.redis.cacheDb) | quote }}
  CELERY_BROKER_URL: {{ include "backend.brokerUrl" . | quote }}
  CELERY_RESULT_BACKEND: {{ include "backend.redisUrl" (dict "root" . "db" .Values.redis.resultDb) | quote }}
  OLLAMA_BASE_URL: {{ .Values.ollama.baseUrl | quote }}
  OLLAMA_MODEL: {{ .Values.ollama.model | quote }}
  CORS_ORIGINS: {{ .Values.corsOrigins | quote }}
{{- end }}
